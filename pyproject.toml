[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "django-railway-storage"
version = "1.0.0"
description = "Django storage backends and auto-configuration for Railway bucket storage."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "django>=3.2",
    "django-storages[s3]>=1.13",
    "boto3>=1.20",
    "botocore>=1.23",
]

[project.optional-dependencies]
test = ["pytest", "pytest-django"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"

[project.urls]
Homepage = "https://github.com/Franklinson/Railway-Storage"
Issues = "https://github.com/Franklinson/Railway-Storage/issues"
